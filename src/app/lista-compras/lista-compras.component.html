<div class="shopping-card">
  <h2>Lista de Compras</h2>

  <!-- Input e Botão -->
  <form #formularioItem="ngForm" class="d-flex gap-2 mb-3" (ngSubmit)="adicionarItem()">
    <input 
      type="text" 
      class="form-control input-custom" 
      placeholder="Digite o nome do item"
      name="item"
      id="item"
      [(ngModel)]="item"
    />
    <button type="submit" class="btn btn-blue">Adicionar</button>
  </form>

  <!-- Tabela estilo Imagem -->
  <table class="table custom-table m-0">
    <thead>
      <tr>
        <th style="width: 25%;">#</th>
        <th style="width: 50%;">Item</th>
        <th style="width: 25%;"></th>
      </tr>
    </thead>
    <tbody>
      @for(item of lista; track item.id) {
        <tr>
          <td>{{item.id}}</td>
          <td>
            <span [ngClass]="{'item-riscado': item.comprado}"> {{item.nome}} </span>
          </td>
          <td>
            <input class="form-check-input" type="checkbox" [checked]="item.comprado" (click)="riscarItem(item)" />
          </td>
        </tr>
      } @empty {
        <tr>
          <td colspan="3" class="text-center">Nenhum item na lista.</td>
        </tr>
      }
    </tbody>
  </table>
</div>
